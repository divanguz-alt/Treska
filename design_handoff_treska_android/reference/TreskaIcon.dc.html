<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,600;8..144,800&amp;display=swap" rel="stylesheet">
</helmet>
<div style="width:{{ px }};height:{{ px }};border-radius:{{ radius }};overflow:hidden;background:{{ bg }};flex:none">
  <svg viewBox="18 18 72 72" width="100%" height="100%" style="display:block">
    <sc-if value="{{ isA }}" hint-placeholder-val="{{ false }}">
      <rect x="18" y="80" width="72" height="10" fill="{{ shade }}"></rect>
      <polyline points="44,28 54,20 64,28" fill="none" stroke="{{ fg }}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>
      <rect x="41" y="28" width="26" height="4" rx="2" fill="{{ fg }}"></rect>
      <rect x="33" y="33" width="42" height="46" rx="11" fill="{{ fg }}"></rect>
      <rect x="38" y="38" width="32" height="19" rx="5" fill="{{ bg }}"></rect>
      <rect x="46" y="41" width="16" height="5" rx="2.5" fill="{{ accent }}"></rect>
      <circle cx="42" cy="68" r="3.2" fill="{{ accent }}"></circle>
      <circle cx="66" cy="68" r="3.2" fill="{{ accent }}"></circle>
      <rect x="27" y="82" width="54" height="3" rx="1.5" fill="{{ fg }}" opacity=".55"></rect>
    </sc-if>
    <sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
      <polyline points="31,30 39,24 47,30" fill="none" stroke="{{ fg }}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"></polyline>
      <rect x="30" y="30" width="18" height="3.5" rx="1.75" fill="{{ fg }}"></rect>
      <rect x="22" y="34" width="34" height="46" rx="9" fill="{{ fg }}"></rect>
      <rect x="26.5" y="39" width="25" height="16" rx="4" fill="{{ bg }}"></rect>
      <circle cx="30" cy="70" r="2.6" fill="{{ accent }}"></circle>
      <circle cx="48" cy="70" r="2.6" fill="{{ accent }}"></circle>
      <rect x="51" y="45" width="37" height="36" rx="8" fill="{{ accent }}" stroke="{{ bg }}" stroke-width="3.5"></rect>
      <rect x="56.5" y="50" width="26" height="14" rx="3.5" fill="{{ bg }}"></rect>
      <circle cx="61" cy="72" r="2.6" fill="{{ bg }}"></circle>
      <circle cx="78" cy="72" r="2.6" fill="{{ bg }}"></circle>
      <rect x="20" y="84" width="68" height="3" rx="1.5" fill="{{ fg }}" opacity=".5"></rect>
    </sc-if>
    <sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
      <circle cx="44" cy="45" r="21" fill="{{ fg }}" opacity=".16"></circle>
      <rect x="22" y="32" width="46" height="26" rx="13" fill="{{ fg }}"></rect>
      <text x="45" y="51.5" text-anchor="middle" font-family="Roboto Flex, sans-serif" font-weight="800" font-size="18" fill="{{ bg }}">6</text>
      <rect x="44" y="55" width="42" height="26" rx="7" fill="{{ accent }}" stroke="{{ bg }}" stroke-width="3.5"></rect>
      <text x="65" y="72.5" text-anchor="middle" font-family="Roboto Flex, sans-serif" font-weight="800" font-size="14" fill="{{ ink }}">101</text>
    </sc-if>
    <sc-if value="{{ isD }}" hint-placeholder-val="{{ false }}">
      <path d="M26 74 C 42 74, 38 46, 54 46 S 70 34, 82 34" fill="none" stroke="{{ fg }}" stroke-width="8" stroke-linecap="round"></path>
      <circle cx="26" cy="74" r="7" fill="{{ bg }}" stroke="{{ fg }}" stroke-width="4.5"></circle>
      <circle cx="82" cy="34" r="7" fill="{{ bg }}" stroke="{{ fg }}" stroke-width="4.5"></circle>
      <circle cx="54" cy="46" r="14" fill="{{ accent }}" opacity=".3"></circle>
      <circle cx="54" cy="46" r="8" fill="{{ accent }}" stroke="{{ bg }}" stroke-width="3"></circle>
    </sc-if>
    <sc-if value="{{ isE }}" hint-placeholder-val="{{ false }}">
      <ellipse cx="54" cy="85" rx="12" ry="3" fill="{{ shade }}"></ellipse>
      <path d="M54 22 C39 22 29 33 29 47 C29 63 54 84 54 84 C54 84 79 63 79 47 C79 33 69 22 54 22 Z" fill="{{ fg }}"></path>
      <polyline points="49,32 54,28 59,32" fill="none" stroke="{{ bg }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
      <rect x="42" y="33" width="24" height="25" rx="6" fill="{{ bg }}"></rect>
      <rect x="45.5" y="36.5" width="17" height="9" rx="2.5" fill="{{ fg }}"></rect>
      <circle cx="47.5" cy="52" r="1.9" fill="{{ accent }}"></circle>
      <circle cx="60.5" cy="52" r="1.9" fill="{{ accent }}"></circle>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;,&quot;d&quot;,&quot;e&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;zet&quot;,&quot;mono&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;squircle&quot;,&quot;circle&quot;,&quot;square&quot;],&quot;default&quot;:&quot;squircle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;}}">
const PAL = {
  zet: { bg: 'oklch(0.45 0.15 258)', fg: 'oklch(0.99 0 0)', accent: 'oklch(0.88 0.17 98)', ink: 'oklch(0.25 0.06 258)', shade: 'oklch(0.38 0.14 258)' },
  light: { bg: 'oklch(0.98 0.005 258)', fg: 'oklch(0.45 0.15 258)', accent: 'oklch(0.86 0.17 95)', ink: 'oklch(0.25 0.06 258)', shade: 'oklch(0.93 0.02 258)' },
  mono: { bg: 'oklch(0.9 0.04 258)', fg: 'oklch(0.33 0.09 258)', accent: 'oklch(0.33 0.09 258)', ink: 'oklch(0.9 0.04 258)', shade: 'oklch(0.85 0.05 258)' }
};
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'a', p = PAL[this.props.palette ?? 'light'], size = this.props.size ?? 160;
    const shape = this.props.shape ?? 'squircle';
    return {
      ...p, px: size + 'px', radius: shape === 'circle' ? '50%' : shape === 'square' ? '0' : '30%',
      isA: v === 'a', isB: v === 'b', isC: v === 'c', isD: v === 'd', isE: v === 'e'
    };
  }
}
</script>
</body>
</html>
