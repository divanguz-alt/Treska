# The `reality` tag marks tests that need ~19 MB of captured ZET fixtures
# (static GTFS zip + a relay frame) under fixed paths. They check the engine
# against real production data, so they are skipped in the default run.
#
# Run them with:
#   flutter test --tags reality --run-skipped
tags:
  reality:
    skip: "needs the real ZET fixtures; run with --tags reality --run-skipped"
